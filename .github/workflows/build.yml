name: Build WeatherControlPlugin

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "AssettoServer surum etiketi (sunucunuzla ayni olmali)"
        default: "v0.0.55-pre44"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: AssettoServer kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: compujuckel/AssettoServer
          ref: ${{ inputs.ref || 'v0.0.55-pre44' }}
          path: AssettoServer

      - name: Eklenti kodunu AssettoServer klasorunun icine al
        uses: actions/checkout@v4
        with:
          path: AssettoServer/WeatherControlPlugin

      - name: .NET 9 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Derle
        working-directory: AssettoServer/WeatherControlPlugin
        run: dotnet publish -c Release -r win-x64

      - name: Sonucu yukle
        uses: actions/upload-artifact@v4
        with:
          name: WeatherControlPlugin
          path: AssettoServer/out-win-x64/plugins/WeatherControlPlugin
          if-no-files-found: error
